<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BM STUDIO — дизайн интерьера</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --dark: #2c1f16;
      --cream: #f3ebdf;
      --cream-muted: rgba(243, 235, 223, 0.8);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px 16px 24vh;
      color: var(--cream);
      font-family: "Montserrat", "Segoe UI", sans-serif;
      background-color: var(--dark);
      /* Фото интерьера + лёгкое затемнение для читаемости текста */
      background-image:
        radial-gradient(ellipse 55% 45% at 50% 38%, rgba(30, 20, 14, 0.55) 0%, rgba(30, 20, 14, 0) 100%),
        linear-gradient(180deg, rgba(30, 20, 14, 0.25) 0%, rgba(30, 20, 14, 0.1) 60%, rgba(30, 20, 14, 0.35) 100%),
        url("images/background.jpg");
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    main {
      text-align: center;
      max-width: 560px;
    }
    .logo {
      display: block;
      width: 72px;
      height: auto;
      margin: 0 auto 32px;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.25));
    }
    h1 {
      margin: 0 0 18px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 300;
      font-size: clamp(44px, 11vw, 76px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.3);
    }
    .job {
      margin: 0 0 44px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--cream-muted);
    }
    .btn {
      display: inline-block;
      padding: 15px 38px;
      border: 1px solid var(--cream);
      color: var(--cream);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      transition: background 0.25s, color 0.25s;
    }
    .btn:hover {
      background: var(--cream);
      color: var(--dark);
    }
    @media (max-width: 600px) {
      body {
        padding-bottom: 18vh;
        /* на телефоне держим в кадре лампу и кресло */
        background-position: 55% bottom;
        background-attachment: scroll;
      }
      .logo { width: 60px; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="images/logo.png" alt="Логотип BM STUDIO">
    <h1>BM STUDIO</h1>
    <p class="job">Дизайнер интерьера</p>
    <a class="btn" href="https://wa.me/77075455094" target="_blank" rel="noopener">Написать мне</a>
  </main>
</body>
</html>
